# Deploy with: docker stack deploy -c docker-compose.swarm.yml ${STACK_NAME:-mn-data-prepare}
# (see ../scripts/deploy_stack.sh for the wrapper that also builds/pushes images)
#
# Networking note: every service here runs with network_mode: host on
# purpose. Swarm's overlay network gives every replica of a service a single
# load-balanced VIP -- fine for stateless web services, wrong for us: a
# worker MUST talk to the Ollama instance on its OWN node (that's the whole
# point of pairing one Ollama+two-A4000s with one worker per node), not a
# random one picked by the mesh. Host networking sidesteps that entirely:
# ollama binds 127.0.0.1:11434 on its node, the local worker calls exactly
# that, and everyone talks to the coordinator via the manager's fixed IP.
# We still get everything else Swarm is used for here: one-command rollout,
# placement constraints, GPU generic-resource scheduling, restart policies.
version: "3.8"

services:
  coordinator:
    image: ${REGISTRY}/mn-dataprep-coordinator:latest
    network_mode: host
    environment:
      - PIPELINE_CONFIG=/app/config/pipeline.yaml
    volumes:
      - ${MOUNT_DATA}:/data:ro
      - ${MOUNT_PREPARE}:/data_prepare
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          memory: 4G

  ollama:
    image: ${REGISTRY}/mn-dataprep-ollama:latest
    network_mode: host
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_BASE_MODEL=${OLLAMA_BASE_MODEL:-muse-glimmer:30b}
      - OLLAMA_INSTRUCTED_TAG=${OLLAMA_INSTRUCTED_TAG:-muse-glimmer-mn}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - /var/lib/genai/ollama:/root/.ollama
    deploy:
      mode: global
      placement:
        constraints: [node.labels.role == gpu-worker]
      restart_policy:
        condition: any
        delay: 5s
      resources:
        reservations:
          generic_resources:
            - discrete_resource_spec:
                kind: "gpu"
                value: 2

  worker:
    image: ${REGISTRY}/mn-dataprep-worker:latest
    network_mode: host
    environment:
      - PIPELINE_CONFIG=/app/config/pipeline.yaml
      - OLLAMA_HOST=http://127.0.0.1:11434
      - COORDINATOR_URL=http://${MANAGER_IP}:8000
      # WORKER_ID left unset on purpose -> falls back to `hostname`, which
      # Docker sets to a unique per-task container id under `mode: global`.
    volumes:
      - ${MOUNT_DATA}:/data:ro
      - ${MOUNT_PREPARE}:/data_prepare
    depends_on: [ollama]
    deploy:
      mode: global
      placement:
        constraints: [node.labels.role == gpu-worker]
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 8G
